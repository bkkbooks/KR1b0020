body:
  text: 融堂書解卷十六宋錢時撰蔡仲之命蔡叔既沒王命蔡仲踐諸侯位作蔡仲之命鯀殛死而禹興蔡叔沒而仲命父子兄弟罪不相及古之道也然叔既囚則以罪廢矣必待其沒而後始命仲何耶曰此周公之心也不幸處人道之變而抵兄弟于罪此萬世之心法宗廟社稷之大計所不容己者若夫手足之義則豈能一日忘哉死者已死而囚者猶庶幾其或改也一日感悟自贖前愆聖人當必有所處直至于沒而後付之其子此周公之心所以甚不得已歟仁昭而義見法行而恩不廢聖人大公至正之道也踐履也易曰履帝位惟周公位冢宰正百工羣叔流言乃致辟管叔于商囚蔡叔于郭鄰以車七乘降霍叔于庶人三年不齒蔡仲克庸祗德周公以為卿士叔卒乃命諸王邦之蔡此節乃史氏叙述命蔡仲來厯也春秋凡盟內為主稱及外為主稱㑹金縢謂管叔及其羣弟乃流言于國是管叔為主實首惡也故就商誅之也蔡叔次之故止于囚霍叔又次之故以車七乘降于庶人不得齒宗盟之列三年後方封霍侯先儒往往將以車七乘屬上文不特文義未安而事理亦甚易見郭鄰之囚得不死耳豈復資之以車囚者車而降庶人者反不車耶周召分陜圻內諸侯二卿治事周官乃施則于都鄙而建其長立其兩兩即二卿也先儒謂叔封圻內之蔡仲所封在淮汝之間圻內之名已滅仍取之以名新國此說當有所據王若曰小子胡惟爾率德改行克慎厥猷肆豫命爾侯于東土往即乃封敬哉爾尚蓋前人之愆惟忠惟孝爾乃邁迹自身克勤無怠以垂憲乃後率乃祖文王之彞訓無若爾考之違王命皇天無親惟德是輔民心無常惟惠之懷為善不同同歸于治為惡不同同歸于亂爾其戒哉慎厥初惟厥終終以不困不惟厥終終以困窮懋乃攸績睦乃四鄰以蕃王室以和兄弟康濟小民率自中無作聰明亂舊章詳乃視聽罔以側言改厥度則豫一人汝嘉此下命辭也是書乃訓其家之子弟専以乃父為戒辭㫖深切與微子之命不同然當分作數截看惟爾率德改行以下是言今日受命之故也爾尚蓋前人之愆以下是欲深監往事専勉之以忠孝也皇天無親以下是言天人懷輔之原善惡治亂之本使之謹終如始也懋乃攸績以下明其職業也率自中以下戒其變亂也既専以無若爾考之違王命為戒恐仲執定此又概言凡惡皆不可為以包之王曰嗚呼小子胡汝往哉無荒棄朕命告命已畢再發歎呼其名而語之汝往哉者臨遣就國之辭也成王東伐淮夷遂踐奄作成王政異時東征者周公也成王即政淮夷又叛及始親政故大誥序周公相成王而此則曰成王東伐淮夷也古今說者皆兼言淮夷徐奄以愚考之大誥止書三監及淮夷叛而昔朕來自奄僅于多士見之此成王東伐淮夷而費誓之作與此同一時也亦止云徐夷並興未嘗及奄若奄與淮夷俱動干戈則六師當首及之何孔子序書乃爾耶况因伐淮夷而遂踐奄兵不主為奄而出也明矣然則奄非首惡其殆助淮夷為亂者歟或曰然則曷為踐奄又遷其君曰奄乃東方之國異時助紂為惡武王伐之武王崩助淮夷周公征之今成王即政可以戒矣而又助淮夷怙終不悛略無尊君親上之義特書曰遂踐奄言其至此無復可恕故决然遂踐也踐者親厯其國而黜奪之成王即政之初首為斯舉非得已也乃此時王政第一著事其成其敗繫于此故政成而紀之以書曰成王政成王既踐奄將遷其君于蒲姑周公告召公作將蒲姑既踐奄則國非其國矣于是欲遷其君于蒲姑蒲姑齊地與鎬京東西相距為逺所以竄之為數叛故剗鋤其根也周召師保時同在奄可遷則遷耳曷為將遷而周公復告召公耶當時周公主此義而召公意有未合故陳述所以不可不遷之㫖史氏紀而成書名曰將蒲姑也多方成王歸自奄在宗周誥庶邦作多方說者謂此書是告多方諸侯以愚觀之殆不然詳玩節節文義未嘗語及諸侯惟五月丁亥王來自奄至于宗周周公曰王若曰猷告爾四國多方惟爾殷侯尹民我惟大降爾命爾罔不知洪惟圖天之命弗永寅念于祀惟帝降格于夏有夏誕厥逸不肯戚言于民乃大淫昏不克終日勸于帝之迪乃爾攸聞厥圖帝之命不克開于民之麗乃大降罰崇亂有夏因甲于內亂不克靈承于旅罔丕惟進之恭洪舒于民亦惟有夏之民叨懫日欽劓割夏邑天惟時求民主乃大降顯休命于成湯刑殄有夏惟天不畀純乃惟以爾多方之義民不克永于多享惟夏之恭多士大不克明保享于民乃胥惟虐于民至于百為大不克開乃惟成湯克以爾多方簡代夏作民主慎厥麗乃勸厥民刑用勸以至于帝乙罔不明德慎罰亦克用勸要囚殄戮多罪亦克用勸開釋無辜亦克用勸今至于爾辟弗克以爾多方享天之命猷者發語辭篇內兩箇猷字是兩箇換頭殷侯者殷之諸侯也當時天下歸周已久何故尚言殷侯尹民蓋天下之民皆異時殷諸侯所尹之民為未忘殷所以數亂告爾四國多方即繼之曰惟爾殷侯尹民正是原其情欵以唘下文所誥也民麗乎善則為善麗乎惡則為惡惟上之人開其昏惑而導其所趨向者何如耳前言民之麗後言君之麗君之麗即民之麗也在能謹之耳觀此節者當詳克與不克之義不克者四大不克者二而夏之所以亡克者一亦克者三而商之所以興奈之何至于爾辟而又弗克也然則轉商為周其咎果安在乎嗚呼王若曰誥告爾多方非天庸釋有夏非天庸釋有殷乃惟爾辟以爾多方大淫圖天之命屑有辭乃惟有夏圖厥政不集于享天降時喪有邦間之乃惟爾商後王逸厥逸圖厥政不蠲蒸天惟降時喪惟聖罔念作狂惟狂克念作聖天惟五年須暇之子孫誕作民主罔可念聽天惟求爾多方大動以威開厥顧天惟爾多方罔堪顧之惟我周王靈承于旅克堪用德惟典神天天惟式教我用休簡畀殷命尹爾多方今我曷敢多誥我惟大降爾四國民命爾曷不忱裕之于爾多方爾曷不夾介乂我周王享天之命今爾尚宅爾宅畋爾田爾曷不惠王熙天之命爾乃迪屢不靜爾心未愛爾乃不大宅天命爾乃屑播天命爾乃自作不典圖忱于正我惟時其教告之我惟時其戰要囚之至于再至于三乃有不用我降爾命我乃其大罰殛之非我有周秉德不康寧乃惟爾自速辜此節承上文極言商之所以亡周之所以興發揮今日誥告多方之意也然當分作三截看自非天庸釋至天惟降時喪是言夏商之末得罪天者如此須看兩箇非字與三箇乃惟字相應自惟聖罔念至尹爾多方是言天非迫遽亡商而興周須待子孫而罔可求爾多方而罔堪然後乃畀我周王者如此須看罔可罔堪與克堪字相應自今我曷敢至自速辜是言爾等何不如此而乃反如此我今日所以誥告者如此須看三箇爾曷不與四箇爾乃字相應上節既極言桀圖帝之命以至放敗此圖天之命卻是主紂而言語脈相承靈承于旅與桀不克靈承正相反我惟大降爾四國民命爾何不自信以寬裕于爾多方乎只為懷疑未釋淺深不裕所以擾擾如此夫以四國之民且大降其命則多方可以信矣裕矣斯言正指當時病根爾乃自作不典以謀信于正道天下只是一箇正而已安有亂常越法而謂之正者後世姦人亡命謀為不軌而託名為義兵正此之謂自爾乃而下是指再叛之事也非字與乃惟字亦相應與前面語律同王曰嗚呼猷告爾有多方士暨殷多士今爾奔走臣我監五祀越惟有胥伯小大多正爾罔不克臬自作不和爾惟和哉爾室不睦爾惟和哉爾邑克明爾惟克勤乃事爾尚不忌于凶德亦則以穆穆在乃位克閲于乃邑謀介爾乃自時洛邑尚永力畋爾田天惟畀矜爾我有周惟其大介賚爾迪簡在王庭尚爾事有服在大僚自王曰嗚呼猷至于萹末皆告有多方士及殷多士之言而此一莭則勸勉之也然詳味今爾奔走臣我監五祀及爾乃自時洛邑之文則是専為多士之遷洛者而設以此見得前面雖曰多方其實主在四國之民此後雖曰有多方士其實主在殷之多士而因以普告之耳胥伯相長也小大多正者小大衆多之士皆所以相長者也臬法也謂自周公東征以至于今爾等奔走臣服乎我所以監觀者五年不為不久及小大多正以相長之爾宜無不能法矣爾尚不忌于凶德謂爾至今日尚不以昔之凶德為忌耶更無他說則亦穆穆和敬居汝之位而已克閲于乃邑謀介言若能閲視爾邑謀所以介助王室之道也多士之書以其不當有夏迪簡在王庭有服在百僚之語而責之今于此書乃以迪簡在王庭有服在大僚之語而許之蓋出于多士則為怨言出于王則為恩命卷舒闔闢聖人自有權度也王曰嗚呼多士爾不克勸忱我命爾亦則惟不克享凡民惟曰不享爾乃惟逸惟頗大逺王命則惟爾多方探天之威我則致天之罰離逖爾土此節卻申言其不然者而警之以天罰也此節亦有兩轉始言不克勸忱我命而後言大逺王命則又深矣故爾亦則惟與後則惟字相照而辭㫖輕重亦不同凡民惟曰不享謂凡民皆將視效惟曰不享其上矣上文勸勉之言専主洛邑至此警飭之言則兼多方所以普也王曰我不惟多誥我惟祗告爾命又曰時惟爾初不克敬于和則無我怨前告四國多方曰今我曷敢多誥此告有多方士及殷多士亦曰我不惟多誥大抵皆是欲其深體至意勿作言語聽耳詳玩我惟祗告四字怛然懇惻含蓄不盡語小止即又曰時惟爾初嗚呼至矣哉初者猶言與之更始也且武王克商凡幾何年曷為尚發更始之義蓋武王崩三監及淮夷叛今成王即政而又叛是舊染之俗猶未純于周也一時滌蕩咸與惟新是惟爾等革心易慮之方始可不思所謂爾惟和哉者乎融堂書解卷十六
