body:
  text: 融堂書解卷十三宋錢時撰酒誥王若曰明大命于妹邦乃穆考文王肇國在西土厥誥毖庶邦庶士越少正御事朝夕曰祀兹酒惟天降命肇我民惟元祀天降威我民用大亂喪德亦罔非酒惟行越小大邦用喪亦罔非酒惟辜文王誥教小子有正有事無彞酒越庶國飲惟祀德將無醉惟曰我民迪小子惟土物愛厥心臧聰聽祖考之彞訓越小大德小子惟一妹土嗣爾股肱純其藝黍稷奔走事厥考厥長肇牽車牛逺服賈用孝養厥父母厥父母慶自洗腆致用酒庶士有正越庶伯君子其爾典聽朕教爾大克羞耉惟君爾乃飲食醉飽丕惟曰爾克永觀省作稽中德爾尚克羞饋祀爾乃自介用逸兹乃允惟王正事之臣兹亦惟天若元德永不忘在王家此書以德為主首云用大亂喪德云德將無醉曰越小大德曰作稽中德曰天若元德曰經德曰助成王德曰惟德馨香祀德字是一書之元氣茍進德矣百邪路斷何獨不醉于酒哉小子民之子孫也文王誥教其民之子孫有官以糾正之有農業以勸相勤動之周公于是敷暢文王之旨以誥康叔自惟曰而下本教小子無彞酒之旨而言也説者因妹土嗣爾股肱純之語遂謂我民迪小子至小子惟一皆文王之言殊不知上面文王誥民與庶國兩箇話頭已整整結斷若又再説迪小子不特失之重復且只言民而不言庶國則太偏矣其藝黍稷之語正是接連我民迪小子一段話直至自洗腆致用酒旨意方足細玩繹之其理甚明周公謂文王教小子有正事無彞酒我今日亦惟曰我民迪小子惟土物愛厥心臧耳此惟曰與下文丕惟曰照應皆周公特語迪即教也惟土物愛即有事也民事非君上所能教惟使我民自教其子孫服田力穡一惟土物自愛則其心乃善也妹土前日亂于三監皆吾兄弟吾手足也今繼之以爾康叔乃手足之純德者可不敬承乎提此一語所以警康叔之聽其民之種藝服賈以養父母乃致用酒文王誥教庶國惟因祭祀乃得飲酒飲酒受胙也飲福受胙非庶民之事惟孝養得用酒耳上文教小子則責在民之祖父若表率諸臣則責即全在康叔以身先之故曰其爾典聽朕教典主也諸臣通得飲者惟飲福受胙一事然國君養老卻不在此限故先表出此條然後方明祀飲之教下文再提丕惟曰所以别之也周公謂康叔若大能行養老之禮則惟國君得行非諸臣所可為者爾乃飲之食之至于醉飽禮執醬執爵割牲奉爼是也夫醉飽正是今日所忌曷為以此開之蓋老者邦之耆德至醉至飽乃尊事之禮當然此外祀飲則德將無醉矣介者介于石之介介然自守不為外物遷動之名也先儒介訓大謂爾乃自大用逸深不安此書専以用逸為戒如曰不敢自暇自逸如曰自息乃逸如曰罔愛于殷惟逸因祀飲而用之以為逸豫之端豈德將無醉之義乎康叔自介于用逸則爾身克正罔敢不正如此乃信可為王正事之臣爾之元德天亦順之使爾長享國胙永不忘王家始于作稽終于天若正聖學精的工夫以上發明德將無醉之旨定為康叔君臣得飲酒者之成式也此即始終兩箇話頭皆本諸文王為衛國之法所謂明大命于妹邦者如此王曰封我西土棐徂邦君御事小子尚克用文王教不腆于酒故我至于今克受殷之命上節既専以文王作準的使康叔明大命于妹邦矣于此乃再把文王提醒上文之意謂我肇國在西土特一方伯耳輔往日之邦君御事尚能用文王之教不敢腆于酒今我周家有天下而可不用我家教以從文王之教乎按此一節解原本錯置上節解之首今依經文更正王曰封我聞惟曰在昔殷先哲王迪畏天顯小民經德秉哲自成湯咸至于帝乙成王畏相惟御事厥棐有恭不敢自暇自逸矧曰其敢崇飲越在外服侯甸男衛邦伯越在內服百僚庶尹惟亞惟服宗工越百姓里居罔敢湎于酒不惟不敢亦不暇惟助成王德顯越尹人祗辟我聞亦惟曰在今後嗣王酣身厥命罔顯于民祗保越怨不易誕惟厥縱淫泆于非彞用燕喪威儀民罔不盡傷心惟荒腆于酒不惟自息乃逸厥心疾狠不克畏死辜在商邑越殷國滅無罹弗惟德馨香祀登聞于天誕惟民怨庶羣自酒腥聞在上故天降喪于殷罔愛于殷惟逸天非虐惟民自速辜上文既言西土教行不腆于酒故我有周克受殷命矣于是遂厯陳殷之興亡皆嗜酒與不嗜酒之故我聞惟曰者言我之所聞惟只如此更無他説所以専康叔之聽也經德秉哲不是兩事此正是迪畏實用力處上専言御事而此言百僚蓋指御事而下百官也此書從頭皆兼臣民而言上文自御事至百姓此云庶羣皆兼言臣民也前面只説紂結怨于民如何到此卻専説民自速辜若沈湎止紂一身風俗猶未敗壞只緣淫酗肆虐臣下化之是妹土之俗悉化而為紂矣乃始降喪周公于此只把民自速辜來説正切今日酒誥化商之意則臣在其中王曰封豫不惟若兹多誥古人有言曰人無于水監當于民監今惟殷墜厥命我其可不大監撫于時豫惟曰汝劼毖殷獻臣侯甸男衛矧太史友內史友越獻臣百宗工矧惟爾事服休服采矧惟若疇圻父薄違農父若保宏父定辟矧汝剛制于酒厥或誥曰羣飲汝勿佚盡執拘以歸于周豫其殺又惟殷之迪諸臣惟工乃湎于酒勿庸殺之姑惟教之有斯明享乃不用我教辭惟我一人弗恤弗蠲乃事時同于殺王曰封汝典聽朕毖勿辨乃司民湎于酒先儒謂諸侯有太史而無內史惟天子則有內史春秋三十年傳稱鄭使太史命伯石為卿又齊太史書崔杼事晉太史書趙盾事齊有南史魯有外史楚有左史諸國並無內史則知此太史內史皆殷之故臣故康叔視之為友也繼言及獻臣百宗工以此見得同是説殷賢臣無疑若下文爾事若疇則指康叔之臣而言矣百宗工百僚之尊官此云獻臣之為百宗工則前云獻臣之為諸侯又明矣堅固戒謹賢臣之為侯甸男衛之君者康叔任居方伯統率諸侯故首及之此書首言文王在西土誥毖庶邦庶士正是舉此為康叔作例子文王云誥毖而此云劼毖者蓋當時沈湎之俗敗壞已甚康叔戒謹此事若非用力堅固豈易轉移然必曰獻臣何也賢者轉移為之表倡則其餘可次第而化矣殷之諸臣因紂導迪沈湎者乃舊習使然未必皆諸臣之罪此勿殺姑惟教之教之如何有斯明享是已斯指酒而言謂世有此物蓋為明潔享祀之用非為湎而設也爾輩豈可縱飲乎此正文王祀兹酒之訓上文命康叔劼毖又曰殺明示典憲森乎其甚嚴矣至篇末卻全責康叔典聽朕毖令勿罪民前言我民迪小子而庶士庶伯乃命康叔典聽朕教此則併與民湎于酒可也風化所自其責有歸上行下效其應如響既曰我之所司矣豈可但委其罪于民乎此二語結盡一書大旨備見聖人忠厚之意梓材王曰封以厥庶民暨厥臣逹大家以厥臣逹王惟邦君汝若恆越曰我有師師司徒司馬司空尹旅曰豫罔厲殺人亦厥君先敬勞肆徂厥敬勞肆往姦宄殺人厯人宥肆亦見厥君事戕敗人宥王啓監厥亂為民曰無胥戕無胥虐至于敬寡至于屬婦合由以容王其效邦君越御事厥命曷以引養引恬自古王若兹監罔攸辟惟曰若稽田既勤敷災惟其陳修為厥疆畎若作室家既勤垣墉惟其塗塈茨若作梓材既勤朴斫惟其塗丹雘今王惟曰先王既勤用明德懷為夾庶邦享作兄弟方來亦既用明德后式典集庶邦丕享皇天既付中國民越厥疆土于先王肆王惟德用和懌先後迷民用懌先王受命已若兹監惟曰欲至于萬年惟王子子孫孫永保民案梓材解永樂大典原闕召詔成王在豐欲宅洛邑使召公先相宅作召誥此書作于甲子庶殷丕作以後周公復辟定論之初也而序獨云使召公先相宅作召詔者蓋相宅作誥實一事之始末舉其端則可以概見矣如洛誥一書止遣使來告卜亦此例也惟二月既望越六日乙未王朝步自周則至于豐惟太保先周公相宅越若來三月惟丙午朏越三日戊申太保朝至于洛卜宅厥既得卜則經營越三日庚戌太保乃以庶殷攻位于洛汭越五日甲寅位成若翼日乙卯周公朝至于洛則逹觀于新邑營越三日丁巳用牲于郊牛二越翼日戊午乃社于新邑牛一羊一豕一越七日甲子周公乃朝用書命庶殷侯甸男邦伯厥既命殷庶庶殷丕作自旅王若公以後方是誥辭此一節乃史氏紀營洛次第以明召誥之所由作也洛邑乃周公建議而序云成王何哉蓋宅洛非周公一己之謀實周家一代宗祀之計亦猶黜殷命伐管蔡而例書成王皆所以明周公之心也丙午越三日戊申戊申越三日庚戌庚戌越五日甲寅乙卯越三日丁巳戊午越七日甲子皆連本日算與武成書法不同必先書既望者朔望乃一月之綱領先書既望而後月亦先書朏史氏紀日之法也用牲于郊以告天牛二者以后稷配故禮有郊牛有稷牛祭社于新邑以告地牛一羊一豕一者備物禮之也郊亦新邑舉社則郊可知康誥言五服此所命止侯甸男之邦伯者豈采衛地逺故役不及之歟是役也専用殷民從事極有深意四國作亂殷民沈迷梗化使之奔走服役庶幾視儀聽唱調服于聖人之化乖戾自應潛消此最見措置之妙太保乃以庶邦冢君出取幣乃復入錫周公曰拜手稽首旅王若公誥告庶殷越自乃御事嗚呼皇天上帝改厥元子兹大國殷之命惟王受命無疆惟休亦無疆惟恤嗚呼曷其奈何弗敬天既遐終大邦殷之命兹殷多先哲王在天越厥後王後民兹服厥命厥終智藏瘝在夫知保抱攜持厥婦子以哀籲天徂厥亡出執嗚呼天亦哀于四方民其眷命用懋王其疾敬德誥告庶殷越自乃御事句法與盤庚斆于民由乃在位同詳觀此書専以敬德為主始終無非警戒成王而云誥告庶殷越自乃御事何耶召公當庶殷丕作之後厯陳夏商興亡之故與今王祈天永命之實正將開釋羣疑慰答衆望雖主為成王而發亦因以普告庶殷使之莫不曉然明白洞逹也知得此意方識一書大旨成王在豐不聞至洛而此書旅王則又似在洛矣先儒往往疑焉及觀成王有謂公不敢不敬天之休來相宅周公亦曰孺子來相宅正是營洛之始若不皆在洛中何以謂之來也即曰來矣而又有往新邑汝往敬哉之語復將安往乎幣者諸侯之贄旅者庭實旅伯之旅錫猶師錫帝曰之錫周公既命殷庶而庶殷丕作此時庶邦冢君皆已入見在王所矣召公乃率之以出取所贄幣乃復入與周公曰敢拜手稽首旅王及公仍以所誥告于庶殷越自乃御事始此數語乃召公將陳告辭先自敘其大旨如此也禮諸侯朝王于廟既畢出復束帛加璧入享謂之幣既致于王畢復奉束帛以請覿大夫之私相見也亦謂之幣周公攝政與常禮不同故特先告之而又與王同時並旅然必旅王而後及公者是則君臣之大分也越自乃殷之御事乃者指殷而言由殷御事以逹殷民也看得殷民難化御事實倡之乃自御事甚得其要故後又有王先服殷御事之言惟休惟恤此二語正是為後面興亡之變張本總提一書之綱領也天既遐終而下又申言天所以改殷命與今王所不可不敬之旨遐終即永終也前止言奈何弗敬而此言敬德方是指成王實用力處召公于此著一疾字警䇿極有力昔告武王首言慎德今告成王専言敬德敬既慎也于慎德則曰夙夜罔或不勤于敬德則曰疾此召公平時進學日用自得之妙凡書二篇無非此旨可想見其人之誠篤矣相古先民有夏天迪從子保面稽天若今時既墜厥命今相有殷天迪格保面稽天若今時既墜厥命今沖子嗣則無遺夀耉曰其稽我古人之德矧曰其有能稽謀自天嗚呼有王雖小元子哉其丕能諴于小民今休王不敢後用顧畏于民碞王來紹上帝自服于土中旦曰其作大邑其自時配皇天毖祀于上下其自時中乂王厥有成命治民今休王先服殷御事比介于我有周御事節性惟日其邁王敬作所不可不敬德上節既明休恤之兩端専提殷之所以亡以勉成王疾敬德矣此節又兼提夏商興亡之變以明今曰宅洛致休之道而復歸宿于成王之敬德也首獨及禹者蓋唐虞禪不可以世代興廢言至禹而後傳諸其子此世代相傳之始也故曰迪從子保面稽天若面面稽考天無不順湯不傳子而傳孫故不言從子而但言天迪格保格至也開迪而保佑之者甚至也今成王更無他説則惟在乎無遺棄老成人之言而已蓋曰老成之人其稽考于我者實古人之德言能以古人之德責望于我也況曰有能稽考其謀本之于天者乎元子上帝之元子也與改厥元子同其作大邑下三箇其字當是將營洛時有此議是周公定論如此正所謂夀耉之言也可遺棄乎人主者卿大夫之儀表比介于我周御事固甚善而本源之地則又在成王當敬為之所可也其所如何惟不可不敬德而已我不可不監于有夏亦不可不監于有殷我不敢知曰有夏服天命惟有厯年我不敢知曰不其延惟不敬厥德乃早墜厥命我不敢知曰有殷受天命惟有厯年我不敢知曰不其延惟不敬厥德乃早墜厥命今王嗣受厥命我亦惟兹二國命嗣若功王乃初服嗚呼若生子罔不在厥初生自貽哲命今天其命哲命吉凶命厯年知今我初服宅新邑肆惟王其疾敬德王其德之用祈天永命其惟王勿以小民淫用非彝亦敢殄戮用乂民若有功其惟王位在德元小民乃惟刑用于天下越王顯上下勤恤其曰我受天命丕若有夏厯年式勿替有殷厯年欲王以小民受天永命上節止提夏商興亡之變卻未及其所以然之故至此方極言二代之厯年墜命全在敬德與否以勉成王之疾敬德尤更深切矣我不可不監于夏殷乃承上文不可不敬德之語謂當觀二代為今日敬德之實證也下文四言我不敢知説者殊無的論要之須看得與四箇惟字相應其旨方明耳服猶被也亦受之謂也召公謂二代被受天命非我所敢知也惟有厯年之永此則可知也不使二代之祚更延非我所敢知也惟不敬其德乃至于皂墜其命此則可知也觀不德之早墜厥命則厯年之為敬德也昭昭矣厥者其也指夏商也言今成王嗣受其命非徒嗣其命也我亦惟此二國之命而嗣功耳功者何敬德厯年是已伊尹告太甲于元年而曰嗣厥德罔不在初召公告成王于復辟亦曰嗣若功王乃初服謹始之義也細玩初服之語則知周公復辟是時當已有定議洛誥首陳朕復子明辟直是往反數四而後成王方有豫小子其退即辟于周之言觀此則知洛誥作于十二日乙卯告卜之時而召誥在二十一日甲子以後甚明嗚呼而下發明初服之意也今天于成王其殆命之以哲矣命之以吉凶矣命之以厯年矣何者天固知我今日初服大政宅都新邑而上三者皆于此初而命之如子之初生也天命永短全在小民身上敬德功夫豈容緩乎此言與王其德之用祈天永命正相應德之所以能祈天永命正以小民之故也一篇大旨至是發揮方盡古惟言民而召公専言小民尤更有味也拜手稽首曰豫小臣敢以王之讎民百君子越友民保受王威命明德王末有成命王亦顯我非敢勤惟恭奉幣用供王能祈天永命前云錫周公曰拜手稽首者乃致敬之言也此云拜手稽首曰者方是致敬作禮也德威為畏德明為明有是德自然有是威修之于身則為明德用之于民則為威命一也前所謂王厥有成命至是不特有之而已且將終有此成命而王亦與有光顯也或曰聖人之化一視同仁召公曷為分别讎友曰攻位賦役則専用殷庶則自乃御事又王先服殷御事所以致意殷之臣民者正為調其叛亂反側之情也召公于此特拈出一讎字警成王者深矣王若敬德則讎者可使友不然則若民若百君子讎我之心終然未泯而乘間伺隙于下者豈止于不友而已哉召公此日乃因奉幣而致誥于是復明奉幣之故歸宿一篇之始末謂我非敢勤勤然惟止供奉幣而已蓋用以供之于王欲王能祈天永命也非謂供幣即能祈天永命此幣乃召公合庶邦冢君之禮敬以逹其誥戒之誠不徒在乎幣而在乎王之疾敬德也敬德之旨節節已備且此語承威命明德之下故止以祈天永命為言融堂書解卷十三
