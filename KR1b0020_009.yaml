body:
  text: 融堂書解卷九宋錢時撰周書泰誓上惟十有一年武王伐殷一月戊午師渡孟津作泰誓三篇序云十有一年經云十有三年當是序誤一月即十三年正月商之正朔已絶而周之正朔未頒故但云一月也惟十有三年春大會于孟津王曰嗟我友邦冢君越我御事庶士明聽誓惟天地萬物父母惟人萬物之靈亶聰明作元后元后作民父母經書十有三年春而序以一月書之明其為周之春正月也序不書春而特書曰一月抑亦行夏時之本旨歟今商王受弗敬上天降災下民沈湎冒色敢行暴虐罪人以族官人以世惟宫室臺榭陂池侈服以殘害于爾萬姓焚炙忠良刳剔孕婦皇天震怒命我文考肅將天威大勳未集沈湎冒色而下皆降災之事肆豫小子發以爾友邦冢君觀政于商惟受罔有悛心乃夷居弗事上帝神祇遺厥先宗廟弗祀犧牲粢盛既于凶盜乃曰吾有民有命罔懲其侮天佑下民作之君作之師惟其克相上帝寵綏四方有罪無罪豫曷敢有越厥志此下申明元后作民父母之事同力度德同德度義受有臣億萬惟億萬心豫有臣三千惟一心商罪貫盈天命誅之豫弗順天厥罪惟鈞豫小子夙夜祗懼受命文考類于上帝宜于冢土以爾有衆砥天之罰天矜于民民之所欲天必從之爾尚弼豫一人永清四海時哉弗可失紂之罪如繩之穿物其貫已滿不可復加泰誓中惟戊午王次于河朔羣后以師畢會王乃徇師而誓曰嗚呼西土有衆咸聽朕言我聞吉人為善惟日不足凶人為不善亦惟日不足今商王受力行無度播棄黎老昵比罪人淫酗肆虐臣下化之朋家作仇脅權相滅無辜籲天穢德彰聞書序云一月戊午師渡孟津而此篇首記惟戊午王次于河朔蓋以是日作誓而後渡河既渡遂次于河北諸侯之師于是畢會王乃徇師而誓是上中二篇同日作也吉人為善句此古語也故曰我聞大抵常人之為善惡與吉人凶人大不同吉人者純于為善之名凶人者純于為不善之名也庸常之徒豈全無好善者往往一出一入泛泛悠悠暫作遽輟未必有力惟善人則念念皆善日進無疆惟恐不逮故日見其不足一念之差無非惡習然在常人亦或知所畏忌惟凶人則念念皆惡故亦日見其不足一肆字正是紂力行之效惟天惠民惟辟奉天有夏桀弗克若天流毒下國天乃佑命成湯降黜夏命惟受罪浮于桀剝喪元良賊虐諫輔謂已有天命謂敬不足行謂祭無益謂暴無傷厥鑒惟不逺在彼夏王上文既甚言紂之罪矣于此復舉桀為證且申言紂之罪又有過于桀者以見天必亡之而弔伐之師斷不容後于湯也四箇謂字是舉紂平時無忌憚之言雖是四節而其病根卻只在謂已有天命上天其以豫乂民朕夢協朕卜襲于休祥戎商必克受有億兆夷人離心離德豫有亂臣十人同心同德雖有周親不如仁人天視自我民視天聽自我民聽百姓有過在豫一人夷傷也紂作威殺戮毒痡四海雖有億兆之衆大抵皆傷夷之人耳今朕必往我武惟揚侵于之疆取彼凶殘我伐用張于湯有光勗哉夫子罔或無畏寧執非敵百姓懍懍若崩厥角嗚呼乃一德一心立定厥功惟克永世此篇大槩專把湯伐桀事為例反覆啓告自有夏桀弗克若天至于湯有光辭旨方足卻是與衆士言不可不明以諭之可謂深切矣上文説戎商必克此又説今朕必往兩箇必字斬斬截截略無疑辭雖勵衆心然非武王明斷不如是也湯伐桀有慙德焉今略無口實之嫌反以為有光于湯何也噫弔民伐罪古所未有而湯創行之湯之所以慙者誠懼亂臣賊子為篡為逆而以我藉口也若夫武王之心是乃湯之心湯之所創行者至武王而發揚之前日之慙今日之光也非聖人孰能與于此哉上文辭氣勇決無非言紂之不足畏以激昻衆心然兵凶戰危萬一聞此誓言有輕敵心則大不可于是申言警告而使之知所畏焉言汝等立定我弔民之功乃能各保天年永久其世耳泰誓下時厥明王乃大巡六師明誓衆士王曰嗚呼我西土君子天有顯道厥類惟彰今商王受狎侮五常荒怠弗敬自絶于天結怨于民斫朝涉之脛剖賢人之心作威殺戮毒痡四海崇信姦回放黜師保屏棄典刑囚奴正士郊社不修宗廟不享作奇技淫巧以悅婦人上帝弗順祝降時喪爾其孜孜奉豫一人恭行天罰大巡者親行軍而整肅之渡河之後既已徇師而誓如何明日又誓蓋三令五申所以重其事也中篇止是渡河後言商可必克我今必往不容但已之意若此篇則又將自河北啓行矣遂直言紂汝世讎又明示厚賞顯戮與前書立言大不同至于數紂之罪則又益詳于前書其誓辭淺深固自有次第也然愚于此重有感焉伐桀之時只湯誓一篇所以罪桀不過率遏率割二語而湯誥所言乃作于黜夏之後今武王作誓至三至四而所以數紂之罪極言殫述不一而足此非武王之德有歉于湯蓋亦世變至此不容不爾可為重歎也哉中下二篇皆誓西土之將士也如何稱之曰夫子又稱之曰君子此深有以見古者上下相敬之意後世如驅犬豕就鋒鏑安得有此氣象古人有言曰撫我則后虐我則讎獨夫受洪惟作威乃汝世讎樹德務滋除惡務本肆豫小子誕以爾衆士殄殲乃讎爾衆士其尚迪果毅以登乃辟功多有厚賞不迪有顯戮上節止是槩舉紂衆惡以見其得罪于天至此復提出作威一事切衆士之心而言洪惟作威與作威殺戮正相應此節專主一讎字武王前面都不及賞罰至此將臨敵不可不知所勸戒方正賞罰以示之嗚呼惟我文考若日月之照臨光于四方顯于西土惟我有周誕受多方豫克受非豫武惟朕文考無罪受克豫非朕文考有罪惟豫小子無良上文言賞罰辭旨已盡于是復原文王盛德所以得天下之由蓋三分天下有其二實文王以之我有周誕受多方非今日之故也推此一節最有力言光于四方固無不在此照臨中矣如何又説顯于西土西土岐周也西伯職分所得為者獨西土耳故其政教又特顯于西土也惟文王盛德如此故我有周為天命人心所歸大受多方焉我今日特因文王見成事體卒其成功耳専就文王事體上説數語之間反覆抑揚不惟足以感動人心抑見周有天下已定于文王之日非我今日創為此舉聖人辭氣包蓄極有意味豈徒推功于父引咎歸己而已哉牧誓武王戎車三百兩虎賁三千人與受戰于牧野作牧誓牧在紂近郊三十里武王戎車三百兩虎賁三千人所以紀王者之師以德而不以力也時甲子昧爽王朝至于商郊牧野乃誓王左杖黃鉞右秉白旄以麾曰逖矣西土之人王曰嗟我友邦冢君御事司徒司馬司空亞旅師氏千夫長百夫長及庸蜀羌髳微盧彭濮人稱爾戈比爾干立爾矛豫其誓泰誓中下二篇所以誓西土者詳矣何故武王又費辭如是每疑焉今觀逖矣西土之人與弗迓克奔以役西土二語乃知此書専為誓諸侯及外夷之衆而作夫西土之人熟于武王之節制固不待臨時諄諭况上二篇誓戒之已詳乎況當時諸侯外夷乃厭紂之惡慕義向化翕然來歸者一時臨戰未必皆如聖人之節制也至此豈可不警飭而明告之又況泰誓上篇告友邦冢君等則自稱曰豫小子發此篇下文亦自稱曰今豫發至中下二篇告西土則皆不名矣此義坦然甚明左杖黃鉞特軍旅之容非親用以戰也右手秉白旄而麾之曰逖矣西土之人麾之使逺所以進友邦諸夷之衆而誓之也故下文特書王曰以别之自嗟我友邦以至微盧彭濮人直是逐一指名頭項各使之整擉器械悚然齋肅而始申之曰豫其誓則其非誓西土也明矣先儒往往謂逖矣西土之人為慰勞其征行之逺跋涉之勞此大不然安有八百諸侯及外夷君長咸在而武王獨首私一語于其屬以示恩聖人必不如此細觀上下文意及白旄以麾情狀灼知其非慰勞西土也王曰古人有言曰牝雞無晨牝雞之晨惟家之索今商王受惟婦言是用昏棄厥肆祀弗答昏棄厥遺王父母弟不迪乃惟四方之多罪逋逃是崇是長是信是使是以為大夫卿士俾暴虐于百姓以姦宄于商邑上文既言豫其誓于是復書王曰以明此下之為誓辭也武王此誓専以用婦言數紂之罪故首舉此古語以為證王父祖也王父弟者同祖之弟也母弟者同母之弟也遺猶孤遺也蓋父母亡而幼弱未能自立者也不迪不知所以訓迪也禹數苗只是箇昏迷湯數桀只是箇昏德武王數紂亦是箇昏棄既昏之後事事顛倒何所不有吁可畏哉今豫發惟恭行天之罰今日之事不愆于六步七步乃止齊焉夫子朂哉不愆于四伐五伐六伐七伐乃止齊焉朂哉夫子尚桓桓如虎如貔如熊如羆于商郊弗迓克奔以役西土朂哉夫子爾所弗朂其于爾躬有戮上文既數紂罪于是乃以進退擊刺之節勉之泰誓下篇誓西土有衆止曰奉豫一人恭行天罰此則曰今豫發惟恭行天之罰一惟字甚嚴謂我此舉非有一毫私意利于其間也惟只恭行天之罰耳武王既示之以節制矣然又恐繩于法度而沮其勇氣于是復申告之汝等庶幾奮桓桓之威如虎貔熊羆之在商郊期于克敵武成武王伐殷往伐歸獸識其政事作武成自王若曰而下辭無間隔皆武王之言所謂識其政事也而先儒不察受命于周以前乃史官所記事節而王若曰以下皆述武王所告羣后之言但見前者丁未庚戌等日而癸亥甲子之事反見於後遂疑錯簡文不相屬未免以意更次之不得謂之審矣武成者武功成也惟一月壬辰旁死魄越翼日癸巳王朝步自周于征伐商厥四月哉生明王來自商至于豐乃偃武修文歸馬于華山之陽放牛于桃林之野示天下弗服丁未祀于周廟邦甸侯衛駿奔走執豆籩越三日庚戌柴望大告武城既生魄庶邦冢君暨百工受命于周自惟一月至受命于周乃史官撮記伐商事節以明此書之所由作武王以正月三日自周伐商至四月之三日自商歸至于豐首尾凡一百二十日也歸來弗暇他及且急急偃武修文既偃武修文至四月十九日丁未乃祀于周廟二十二日庚戌柴望大告武功之成蓋祀周廟亦所以告武功柴望之時邦甸侯衛亦未嘗不在互書之可以互見也諸侯方受周之命而與之更始也王若曰嗚呼羣后惟先王建邦啓土公劉克篤前烈至于大王肇基王迹王季其勤王家我文考文王克成厥勳誕膺天命以撫方夏大邦畏其力小邦懷其德惟九年大統未集豫小子其承厥志先儒謂天無二日民無二王豈有殷紂尚存而周稱文王文王乃是追王然中庸止云追王太王王季未嘗言追王文王況武王伐商曰惟有道曾孫周王發又曰昭我周王則伐商之先周已稱王其義甚明若謂殷紂尚存無二王之理則所謂誕膺天命以撫方夏豈臣子所得為哉砥商之罪告于皇天后土所過名山大川曰惟有道曽孫周王發將有大正于商今商王受無道暴殄天物害虐蒸民為天下逋逃主萃淵藪豫小子既獲仁人敢祗承上帝以遏亂略華夏蠻貊罔不率俾恭天成命肆豫東征綏厥士女惟其士女篚厥玄黃昭我周王天休震動用附我大邑周惟爾有神尚克相豫以濟兆民無作神羞此一節武王告羣后以伐商之時所告天地山川之辭也既戊午師逾孟津癸亥陳于商郊俟天休命甲子昧爽受率其旅若林會于牧野罔有敵于我師前徒倒戈攻于後以北血流漂杵一戎衣天下大定上文既述所告天地山川之辭此節告羣后以既渡孟津會戰之事也周至孟津一千里孟津至朝歌四百里武王自癸巳至戊午凡二十六日而渡孟津一日行四十里甚緩自戊午至癸亥凡五日而至商郊一日行八十里甚速先儒以為此奇計也恐未安或者渡河之先如告名山大川會諸侯之類至渡河之後浸迫商郊其勢又當有不容緩者若以為出奇掩其不備如何卻又陳于商郊而待天之休命也孟子謂仁人無敵于天下何其血之流杵也此乃戰國救敝之言或者遂疑此書真有不可信者則誣聖甚矣乃反商政政由舊釋箕子囚封比干墓式商容閭散鹿臺之財發巨橋之粟大賚于四海而萬姓悅服此一節又告克商之後所以反商政之事也乃字正承上文而言列爵惟五分土惟三建官惟賢位事惟能重民五教惟食喪祭惇信明義崇德報功垂拱而天下治此一節卻是告羣后以今日施設規模正所謂受命于周也惟食喪祭此一惟字當連上下作一句看猶言所重者斷斷乎惟在乎民之五教與食與喪祭也此皆武王自言今日之規模所與羣后綱維斯世者在此夫如是復何為哉恭已正南面而已故曰垂拱而天下治言規模一定我但垂衣拱手而聽天下之自治也或者不察以此末句為武王極治之功遂謂乃反商政而下皆史氏所記且自王若曰以後歷歷皆武王之言略無間隔安知其為史氏所記哉一戎衣而天下大定則是結上文伐商之事大賚四海而萬姓悅服則是結上文反商政之事垂拱而天下治則是結上文告羣后以今日施設之事辭旨甚明初無可疑者若謂末句為武王極治之功則作武成時安得便記此語其不然明矣熟玩而後得之案武成一篇先儒以為有錯簡自劉敞王安石程子朱子各有訂正蔡沈作傳載考定新本而謂列爵惟五之上猶有闕文此錢時所解仍從注疏原本謂受命于周以上史官記事之文王若曰以下述武王所告羣后之言至垂拱而天下治略無間隔盡闢闕文錯簡之疑足補注疏所未備融堂書解卷九
